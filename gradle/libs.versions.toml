[versions]
spring-boot = "4.1.2"
kafka-starter = "1.0.0-rc-1"
kotlin = "2.4.10"
ktlint-gradle = "14.2.0"
ktlint-cli = "1.8.0"
binary-compatibility-validator = "0.18.2"
ben-manes-versions = "0.67.0"
junit = "6.1.3"
netty = "4.2.20.Final"
lz4 = "1.13.0"
snappy = "1.1.10.12"
logback = "1.6.6"
# compat-v7 only: the version in production and the platform it runs on (FINT-130).
flyt-kafka-v7 = "7.4.1"
spring-boot-v7 = "3.5.16"
jackson-v7 = "2.22.4"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
kafka-starter = { module = "no.novari:kafka-starter", version.ref = "kafka-starter" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
lz4-java = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4" }
snappy-java = { module = "org.xerial.snappy:snappy-java", version.ref = "snappy" }
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
flyt-kafka-v7 = { module = "no.novari:flyt-kafka", version.ref = "flyt-kafka-v7" }
spring-boot-dependencies-v7 = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot-v7" }
jackson-bom-v7 = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson-v7" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
ben-manes-versions = { id = "com.github.ben-manes.versions", version.ref = "ben-manes-versions" }
